# Default config for the vale-voices hook.
# Vale resolves StylesPath relative to this file.
StylesPath = styles
MinAlertLevel = error
Packages = https://github.com/jdkato/voices/releases/latest/download/Voices.zip

[*.md]
BasedOnStyles = Voices, Direct
Direct.Length[max] = 35

[*.adoc]
BasedOnStyles = Voices, Direct
Direct.Length[max] = 35
